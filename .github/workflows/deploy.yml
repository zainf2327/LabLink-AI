name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lablink-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'
      - name: Install Dependencies
        run: cd server && npm ci
      - name: Type-check
        run: cd server && npx tsc --noEmit
      - name: Run Tests
        run: cd server && npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "server/docker-compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/apps/LabLink"
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/apps/LabLink/server
            mkdir -p logs
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d
            # Robust health check loop (polls up to 6 times, waiting 5 seconds between checks)
            success=false
            for i in {1..6}; do
              echo "Checking backend health (attempt $i of 6)..."
              if curl -s -f http://localhost:5001/health > /dev/null; then
                echo "Health check passed!"
                success=true
                break
              fi
              sleep 5
            done
            if [ "$success" = false ]; then
              echo "❌ Health check failed after 30 seconds!"
              echo "=== Container Logs ==="
              docker compose logs --tail=100
              exit 1
            fi
            docker image prune -f || true
